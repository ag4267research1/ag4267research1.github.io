<div class="h-full flex flex-col group bg-white transition-all duration-300 border border-tlgray-200 overflow-hidden hover:shadow-lg hover:-translate-y-1">
    <a href="{{ .Permalink }}" class="flex flex-col grow">
        {{ if .Params.image }}
        <div class="aspect-video w-full overflow-hidden bg-gray-100">
            <img src="{{ .Params.image | relURL }}" alt="{{ .Title }}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
        </div>
        {{ else }}
        <div class="aspect-video w-full overflow-hidden bg-tlgray-800 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="text-white/60" viewBox="0 0 16 16">
                <path d="M5.854 4.146a.5.5 0 0 1 0 .708L2.707 8l3.147 3.146a.5.5 0 0 1-.708.708l-3.5-3.5a.5.5 0 0 1 0-.708l3.5-3.5a.5.5 0 0 1 .708 0m4.292 0a.5.5 0 0 0 0 .708L13.293 8l-3.147 3.146a.5.5 0 0 0 .708.708l3.5-3.5a.5.5 0 0 0 0-.708l-3.5-3.5a.5.5 0 0 0-.708 0"/>
            </svg>
        </div>
        {{ end }}
        <div class="p-6 flex flex-col grow">
            {{ with .Params.tags }}
            <div class="flex flex-wrap gap-2 mb-3">
                {{ range first 4 . }}
                <span class="text-xs font-mono font-semibold px-2 py-1 bg-blue-50 text-blue-700">{{ . }}</span>
                {{ end }}
            </div>
            {{ end }}
            <h2 class="text-xl font-semibold mb-3 text-tlgray-800 group-hover:text-blue-600 transition-colors line-clamp-2">
                {{ .Title }}
            </h2>
            <p class="text-tlgray-400 text-sm leading-relaxed line-clamp-3 grow">
                {{ .Description | default .Summary | truncate 120 }}
            </p>
        </div>
    </a>
    <div class="px-6 pb-6 flex items-center justify-between text-sm font-semibold">
        <a href="{{ .Permalink }}" class="text-blue-600 group-hover:translate-x-1 transition-transform inline-flex items-center">
            View Project
            <svg xmlns="http://www.w3.org/2000/svg" class="ml-2" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708"/>
            </svg>
        </a>
        {{ with .Params.repo }}
        <a href="{{ . }}" target="_blank" rel="noopener" class="text-tlgray-400 hover:text-tlgray-800 transition-colors inline-flex items-center gap-1" aria-label="View source on GitHub">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
            </svg>
        </a>
        {{ end }}
    </div>
</div>
